<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e40af" />
    <title>Fără conexiune · UBB Campus</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #1e40af;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --accent: #3b82f6;
          --accent-fg: #0f172a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 10px 24px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--muted);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>UBB Campus</h1>
      <p>Nu ai conexiune. Starea sălilor nu poate fi verificată acum.</p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
  </body>
</html>
