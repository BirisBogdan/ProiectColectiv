<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Fără conexiune · UBB Campus</title>
    <style>
      /* Same colours as the Graphite theme in app/globals.css (this page loads no app CSS). */
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #111111;
        --line: #1f1f1f;
        --fg: #ededed;
        --muted: #a1a1a1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.875rem;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        min-height: 44px;
        padding: 10px 20px;
        border: 0;
        border-radius: 6px;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      button:hover {
        background: #ffffff;
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="56" height="56" />
      <h1>UBB Campus</h1>
      <p>Nu ai conexiune. Starea sălilor nu poate fi verificată acum.</p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
  </body>
</html>
